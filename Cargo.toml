[package]
name = "lrgex_compress"
version = "0.1.0"
edition = "2021"
description = "LRGEX Compress — standalone fast .tar.zst compressor/extractor"

[[bin]]
name = "lrgex-compress"
path = "src/main.rs"

[[bin]]
name = "sign"
path = "src/sign.rs"

[dependencies]
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.10"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
ed25519-dalek = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
